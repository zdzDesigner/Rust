[package]
name = "mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
log = "0.4"
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
gpui-mobile = { path = "vendor/gpui-mobile" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
